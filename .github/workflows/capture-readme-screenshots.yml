name: Capture Storm Chaser README screenshots

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/storm-chaser-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/storm-chaser-vite.log
          exit 1

      - name: Capture real application screens
        run: |
          mkdir -p docs/assets
          cat > capture-storm-chaser.mjs <<'JS'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 1,
            geolocation: { latitude: 43.6532, longitude: -79.3832 },
            permissions: ['geolocation'],
          });

          const reports = [
            {
              id: 'demo-supercell',
              photoUrl: '',
              location: { latitude: 43.2557, longitude: -79.8711, locationName: 'Hamilton, ON' },
              timestamp: '2026-08-10T20:15:00.000Z',
              savedAt: '2026-08-10T20:18:00.000Z',
              weatherConditions: 'Thunderstorm',
              notes: 'Rotating storm structure observed west of the city. Strong gust front with frequent lightning.',
              stormType: 'supercell',
              temperature: 24,
              windSpeed: 38
            },
            {
              id: 'demo-hail',
              photoUrl: '',
              location: { latitude: 43.3255, longitude: -79.7990, locationName: 'Burlington, ON' },
              timestamp: '2026-08-09T22:40:00.000Z',
              savedAt: '2026-08-09T22:44:00.000Z',
              weatherConditions: 'Thunderstorm with hail',
              notes: 'Pea-sized hail and intense rainfall. Visibility briefly reduced during the strongest core.',
              stormType: 'hailstorm',
              temperature: 21,
              windSpeed: 46
            },
            {
              id: 'demo-microburst',
              photoUrl: '',
              location: { latitude: 43.1594, longitude: -79.2469, locationName: 'St. Catharines, ON' },
              timestamp: '2026-08-08T19:05:00.000Z',
              savedAt: '2026-08-08T19:10:00.000Z',
              weatherConditions: 'Heavy rain',
              notes: 'Sudden wind shift with a short burst of damaging straight-line winds followed by heavy rain.',
              stormType: 'microburst',
              temperature: 23,
              windSpeed: 62
            }
          ];

          await context.addInitScript((seedReports) => {
            localStorage.setItem('storm-chaser-reports', JSON.stringify(seedReports));
          }, reports);

          const page = await context.newPage();

          await page.route('https://api.open-meteo.com/**', async route => {
            const now = new Date('2026-08-11T07:00:00.000Z');
            const hourlyTimes = Array.from({ length: 24 }, (_, i) => new Date(now.getTime() + i * 3600000).toISOString().slice(0, 16));
            const hourlyTemps = Array.from({ length: 24 }, (_, i) => 24 - Math.round(Math.abs(10 - i) * 0.35));
            const hourlyCodes = Array.from({ length: 24 }, (_, i) => i < 7 ? 95 : i < 13 ? 81 : 3);
            const hourlyWind = Array.from({ length: 24 }, (_, i) => 34 + (i % 6) * 3);
            const hourlyPrecip = Array.from({ length: 24 }, (_, i) => i < 10 ? +(1.2 + (i % 4) * 0.8).toFixed(1) : 0.2);
            const dailyDates = ['2026-08-11','2026-08-12','2026-08-13','2026-08-14','2026-08-15','2026-08-16','2026-08-17'];

            await route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify({
                current: {
                  temperature_2m: 24.1,
                  relative_humidity_2m: 78,
                  apparent_temperature: 27.0,
                  precipitation: 2.4,
                  weather_code: 95,
                  cloud_cover: 91,
                  pressure_msl: 1003.4,
                  surface_pressure: 1000.8,
                  wind_speed_10m: 41,
                  wind_direction_10m: 247,
                  wind_gusts_10m: 67
                },
                hourly: {
                  time: hourlyTimes,
                  temperature_2m: hourlyTemps,
                  weather_code: hourlyCodes,
                  wind_speed_10m: hourlyWind,
                  precipitation: hourlyPrecip
                },
                daily: {
                  time: dailyDates,
                  weather_code: [95, 81, 3, 2, 61, 1, 2],
                  temperature_2m_max: [25, 24, 26, 27, 23, 25, 26],
                  temperature_2m_min: [18, 17, 16, 18, 17, 16, 18],
                  precipitation_sum: [18.4, 8.2, 0, 0, 4.8, 0, 0.3],
                  wind_speed_10m_max: [67, 49, 30, 24, 39, 21, 27]
                }
              })
            });
          });

          await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
          await page.getByText('Thunderstorm', { exact: true }).first().waitFor({ timeout: 15000 });
          await page.screenshot({ path: 'docs/assets/weather.png', fullPage: false });

          await page.getByRole('button', { name: /Document/ }).click();
          await page.waitForTimeout(500);
          await page.screenshot({ path: 'docs/assets/document.png', fullPage: false });

          await page.getByRole('button', { name: /Log/ }).click();
          await page.getByText('Rotating storm structure observed west of the city.', { exact: false }).waitFor({ timeout: 10000 });
          await page.screenshot({ path: 'docs/assets/storm-log.png', fullPage: false });

          await page.getByRole('button', { name: /Map/ }).click();
          await page.waitForTimeout(1800);
          await page.screenshot({ path: 'docs/assets/storm-map.png', fullPage: false });

          await browser.close();
          JS
          node capture-storm-chaser.mjs
          rm capture-storm-chaser.mjs
          file docs/assets/*.png

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
            exit 0
          fi
          git commit -m "Add real Storm Chaser screenshots"
          git push
